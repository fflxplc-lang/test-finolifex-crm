# /etc/nginx/sites-available/finowise-test  (test copy; prod is the "lifex" site)
# certbot --nginx -d test.freedomlifex.in adds HTTPS to this block only.
server {
    listen 80;
    listen [::]:80;
    server_name test.freedomlifex.in;

    client_max_body_size 25m;   # Excel/XLS imports

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
